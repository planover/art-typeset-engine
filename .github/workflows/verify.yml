name: 口径与方法论验算

# 云端只做「验算」不渲染：零字体依赖，公开仓标准 Linux runner 永久免费。
# 触发：配方/脚本推送后；也可手动触发。
on:
  push:
    branches: [main]
    paths:
      - 'art_typeset/**'
      - 'README.md'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest   # public 仓标准 runner，$0/分钟
    steps:
      - name: 拉取工具引擎
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖（仅 Pillow + NumPy，无字体）
        run: pip install pillow numpy

      - name: 1) 全部配方门禁（逐字/字号/冲突/布局，纯文本）
        run: python -m art_typeset check --all

      - name: 2) golden 快照注册存在性（未纳入时自动跳过）
        run: python -m art_typeset golden check

# 刻意不跑这两项（云端环境必然失败，属本地专属校验）：
# - methodology all：检查 final_png 是否落盘，云端无成图（LFS 在内容仓）
# - derive audit：依赖本机 spec.CONTENT 与 SKILL.md 绝对路径
# 这两项已在本地提交前执行通过（methodology 34/34、audit 14/14）。
